name: SonarQube

# Herramienta de análisis estático #1: SonarQube Cloud.
# Requiere en el repositorio (Settings > Secrets and variables > Actions):
#   - Secret   SONAR_TOKEN        -> token generado en SonarQube Cloud
#   - Variable SONAR_PROJECT_KEY  -> Project Key que muestra SonarQube Cloud
#   - Variable SONAR_ORGANIZATION -> Organization Key de SonarQube Cloud
# "Automatic Analysis" debe estar desactivado en SonarQube Cloud.
#
# - Los archivos C# los toma el scanner de los proyectos de la solución; el
#   proyecto de pruebas se detecta como código de prueba automáticamente.
# - sonar.scanner.scanAll=true analiza también los archivos que no son .NET
#   (frontend Vue/TypeScript cuando exista).
# - sonar.cs.roslyn.ignoreIssues=true: Sonar muestra solo SUS reglas, para que
#   la comparación con Roslyn (workflow CI) no mezcle hallazgos.

on:
  push:
    branches: ['main', 'dev', 'feature/**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonar:
    name: Build and analyze
    runs-on: ubuntu-latest
    env:
      SOLUTION: CharliesSneakersPOS.slnx
      RUNSETTINGS: backend/CharliesSneakersPOS.Tests/coverage.runsettings
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo para que Sonar asigne bien los hallazgos

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "dir=frontend" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then echo "dir=." >> "$GITHUB_OUTPUT"
          else echo "dir=" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node
        if: steps.detect.outputs.dir != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.detect.outputs.dir }}/package-lock.json

      - name: Frontend dependencies (para analizar Vue/TypeScript)
        if: steps.detect.outputs.dir != ''
        working-directory: ${{ steps.detect.outputs.dir }}
        run: npm ci --ignore-scripts

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.SONAR_PROJECT_KEY }}"
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.scanner.scanAll=true
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/coverage/**,**/assets/**"
          /d:sonar.coverage.exclusions="backend/CharliesSneakersPOS.Api/**,backend/CharliesSneakersPOS.Infrastructure/**,src/**,frontend/**"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx"
          /d:sonar.cs.roslyn.ignoreIssues=true

      - name: Build
        run: dotnet build $SOLUTION -c Release -p:RoslynSarif=false

      - name: Test + coverage
        run: >
          dotnet test $SOLUTION --no-build -c Release
          --settings $RUNSETTINGS
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFileName=results.trx"

      - name: Sonar end
        if: success() || failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
