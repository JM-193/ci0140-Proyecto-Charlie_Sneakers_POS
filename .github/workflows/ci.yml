name: CI

# Estructura del repositorio:
#   CharliesSneakersPOS.slnx                      -> solución .NET 10
#   backend/CharliesSneakersPOS.Api               -> API (ASP.NET Core)
#   backend/CharliesSneakersPOS.Domain            -> lógica de negocio (se mide cobertura)
#   backend/CharliesSneakersPOS.Infrastructure    -> acceso a datos
#   backend/CharliesSneakersPOS.Tests             -> pruebas xUnit + coverlet
#   package.json en la raíz o en frontend/        -> frontend Vue + TypeScript (npm)
# El frontend se salta solo mientras todavía no exista en el repo.

on:
  push:
    branches: ['main', 'dev', 'feature/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend C#: compilación con Roslyn, pruebas y cobertura (M5.1, M5.2, M5.3)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (build, Roslyn, tests, coverage)
    runs-on: ubuntu-latest
    env:
      SOLUTION: CharliesSneakersPOS.slnx
      RUNSETTINGS: backend/CharliesSneakersPOS.Tests/coverage.runsettings
      # Umbral de cobertura de líneas. Se cambia sin editar este archivo con
      # la variable de repositorio MIN_COVERAGE (Settings > Secrets and variables > Actions).
      MIN_COVERAGE: ${{ vars.MIN_COVERAGE || '90' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore $SOLUTION

      - name: Build (Roslyn / .NET Code Analysis)
        run: dotnet build $SOLUTION --no-restore -c Release

      - name: Test + coverage
        run: >
          dotnet test $SOLUTION --no-build -c Release
          --settings $RUNSETTINGS
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFileName=results.trx"

      - name: Coverage report
        if: success() || failure()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"Html;TextSummary;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Roslyn findings summary (M5.1 / M5.2)
        if: success() || failure()
        run: |
          # Se consideran los proyectos de producción (no el de pruebas)
          FILES=$(ls analysis/*.sarif 2>/dev/null | grep -v '\.Tests\.sarif$' || true)
          if [ -z "$FILES" ]; then echo "No se generaron archivos SARIF"; exit 0; fi
          ALL=$(jq -s '[.[].runs[].results[]?]' $FILES)
          TOTAL=$(echo "$ALL" | jq 'length')
          ERRORS=$(echo "$ALL" | jq '[.[] | select(.level=="error")] | length')
          CA1502=$(echo "$ALL" | jq '[.[] | select(.ruleId=="CA1502")] | length')
          LOC=$(find backend -name '*.cs' -not -path '*/bin/*' -not -path '*/obj/*' -not -path '*Tests*' -exec cat {} + | grep -cv '^\s*$')
          PER_KLOC=$(awk -v w="$TOTAL" -v l="$LOC" 'BEGIN{printf "%.2f", (l>0? w*1000/l : 0)}')
          {
            echo "## Roslyn / .NET Code Analysis (backend, sin pruebas)"
            echo ""
            echo "| Indicador | Valor |"
            echo "|---|---|"
            echo "| Diagnósticos totales | $TOTAL |"
            echo "| Errores | $ERRORS |"
            echo "| Líneas de código C# (sin vacías) | $LOC |"
            echo "| Diagnósticos por 1000 líneas (M5.2) | $PER_KLOC |"
            echo "| Métodos con complejidad > 10 (CA1502, M5.1) | $CA1502 |"
            echo ""
            echo "### Reglas más frecuentes"
            echo ""
            echo "| Regla | Cantidad |"
            echo "|---|---|"
            echo "$ALL" | jq -r '[.[].ruleId] | group_by(.) | map({r: .[0], n: length})
                   | sort_by(-.n) | .[:15][] | "| \(.r) | \(.n) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            coverage-report/
            TestResults/**/*.trx
            analysis/*.sarif
          if-no-files-found: ignore

      - name: Enforce line coverage >= MIN_COVERAGE
        run: |
          LINE=$(grep -oP 'Line coverage: \K[0-9.]+' coverage-report/Summary.txt)
          BRANCH=$(grep -oP 'Branch coverage: \K[0-9.]+' coverage-report/Summary.txt || echo "n/a")
          echo "Cobertura de líneas: ${LINE}% | ramas: ${BRANCH}% | mínimo: ${MIN_COVERAGE}%"
          awk -v c="$LINE" -v m="$MIN_COVERAGE" 'BEGIN{exit !(c>=m)}' \
            || { echo "::error::Cobertura de líneas ${LINE}% es menor que ${MIN_COVERAGE}%"; exit 1; }

  # ---------------------------------------------------------------------------
  # Frontend Vue + TypeScript: lint, type-check/build y pruebas
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "dir=frontend" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then echo "dir=." >> "$GITHUB_OUTPUT"
          else echo "dir=" >> "$GITHUB_OUTPUT"; echo "::notice::No existe package.json, se omite el frontend."; fi

      - name: Set up Node
        if: steps.detect.outputs.dir != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.detect.outputs.dir }}/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.dir != ''
        working-directory: ${{ steps.detect.outputs.dir }}
        run: npm ci

      - name: Lint (oxlint + ESLint)
        if: steps.detect.outputs.dir != ''
        working-directory: ${{ steps.detect.outputs.dir }}
        run: npx oxlint . && npx eslint . --max-warnings=0

      - name: Type-check + build
        if: steps.detect.outputs.dir != ''
        working-directory: ${{ steps.detect.outputs.dir }}
        run: npm run build

      - name: Unit tests
        if: steps.detect.outputs.dir != ''
        working-directory: ${{ steps.detect.outputs.dir }}
        run: npx vitest run --passWithNoTests
